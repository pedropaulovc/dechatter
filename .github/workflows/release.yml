name: release

# Pushing a tag vX.Y.Z publishes the widget to npm and creates the GitHub release. npm
# trusts this workflow through OIDC, so there is no token to store.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: uv sync --locked

      - name: Check that the tag, package.json and pyproject.toml agree on the version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python .github/release_version.py "$RELEASE_TAG"

      - run: uv run ruff check .
      - run: uv run pytest -q

      # prepack builds web/ with `dechatter widget`, downloading and verifying Pyodide.
      - name: Check package contents
        run: npm run pack:check

      - name: Publish to npm
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag
