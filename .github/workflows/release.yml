name: release

# Pushing a tag vX.Y.Z on a commit of main publishes the widget to npm and creates the
# GitHub release. npm trusts this workflow through OIDC, so there is no token to store.
# That trust is registered on the package (`npm trust github dechatter --file release.yml
# --repo pedropaulovc/dechatter`), which is why 0.1.0 was published by hand first.
# Re-running a release that failed part-way is safe: steps already done are skipped.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: uv sync --locked

      - name: Check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check that the tag, package.json and pyproject.toml agree on the version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python .github/release_version.py "$RELEASE_TAG"

      # The registry is asked directly, without credentials: 200 means this version is
      # published, 404 that it is not, and anything else stops the release rather than guess.
      - name: See whether npm already has this version
        id: npm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/dechatter/$version")"
          echo "registry answered $status for dechatter@$version"
          case "$status" in
            200) echo "published=yes" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=no" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      # prepack builds web/ with `dechatter widget`: it downloads Pyodide and checks the
      # numpy and scipy wheels against the hashes in Pyodide's lock file.
      - name: Build the package once and publish that build
        if: steps.npm.outputs.published == 'no'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm pack
          npm publish "dechatter-${RELEASE_TAG#v}.tgz"

      - name: Create the GitHub release, unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 && exit 0
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag
