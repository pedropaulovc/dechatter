[project]
name = "dechatter"
dynamic = ["version"]
description = "cncjs widget that finds chatter-free milling parameters from test cuts and sound"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Pedro Paulo Vezza Campos", email = "pedro@vezza.com.br" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.scripts]
dechatter = "dechatter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dechatter/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests share nothing but read-only fixtures, each writing under its own tmp_path, so they
# run on every core; `-n 0` runs them in one process, for a debugger.
addopts = "-n auto --dist worksteal"
